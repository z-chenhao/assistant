{{define "help"}}<span class="control-help" data-context-help><details data-help-fallback><summary aria-label="{{tr "Help"}}: {{.Label}}">{{template "icon-help"}}</summary><span class="control-tooltip">{{.Text}}</span></details><button type="button" class="control-help-trigger" aria-label="{{tr "Help"}}: {{.Label}}" aria-describedby="{{.ID}}" data-help-trigger hidden>{{template "icon-help"}}</button><span id="{{.ID}}" class="control-tooltip" role="tooltip" data-help-tooltip hidden>{{.Text}}</span></span>{{end}}
