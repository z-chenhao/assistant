{{define "notifications"}}
<div class="page-heading"><div><h1>{{tr "Notifications"}}</h1></div></div>
{{if .Settings.TargetUnavailable}}<p class="feedback warning">{{tr "Your saved destination is no longer available. Choose an enabled channel to change it."}}</p>{{end}}<form class="notification-preference" method="post" action="/notification" data-notification-preference><input name="version" type="hidden" value="{{.Preference.Version}}"><div class="setting-row"><label class="setting-name" for="notification-target"><span class="control-field-label">{{tr "Send future notifications to"}}{{template "help" (help "notification-help" (tr "Send future notifications to") (tr "Automatic prefers Feishu when an enabled binding is available. Routine task progress stays in Tasks."))}}</span></label><div class="setting-controls"><select id="notification-target" name="target" aria-describedby="notification-help" required aria-label="{{tr "Send future notifications to"}}">{{if .Settings.TargetUnavailable}}<option value="" selected>{{tr "Choose an available channel"}}</option>{{end}}<option value="auto:" {{if eq .Settings.Target "auto:"}}selected{{end}}>{{tr "Automatic"}}</option><option value="tui:" {{if eq .Settings.Target "tui:"}}selected{{end}}>{{tr "Terminal"}}</option>{{range .Bindings}}{{if .Enabled}}<option value="{{.Channel}}:{{.ID}}" {{if eq $.Settings.Target (bindingTarget .)}}selected{{end}}>{{tr .Channel}} · {{.Destination}}</option>{{end}}{{end}}</select></div></div><div class="settings-actions" data-notification-fallback><button class="secondary setting-action">{{tr "Save notification channel"}}</button></div></form>
<p class="preference-feedback" role="status" data-notification-feedback hidden><span data-notification-message></span> <a href="/settings/notifications" data-notification-refresh hidden>{{tr "Refresh to check"}}</a></p>

{{end}}
