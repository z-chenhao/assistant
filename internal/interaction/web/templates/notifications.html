{{define "notifications"}}
<div class="page-heading"><div><h1>{{tr "Notifications"}}</h1></div></div>
<h2 class="settings-section-title">{{tr "Delivery channel"}}</h2>
{{if .Settings.TargetUnavailable}}<p class="feedback warning">{{tr "Your saved destination is no longer available. Choose an enabled channel to change it."}}</p>{{end}}
<section class="panel form-panel settings-group"><form method="post" action="/notification"><input name="version" type="hidden" value="{{.Preference.Version}}">
<div class="setting-row"><div class="setting-copy"><label for="notification-target">{{tr "Send future notifications to"}}</label></div><select id="notification-target" name="target" required data-select-search>{{if .Settings.TargetUnavailable}}<option value="" selected>{{tr "Choose an available channel"}}</option>{{end}}<option value="auto:" {{if eq .Settings.Target "auto:"}}selected{{end}}>{{tr "Automatic"}}</option><option value="tui:" {{if eq .Settings.Target "tui:"}}selected{{end}}>{{tr "Terminal"}}</option>{{range .Bindings}}{{if .Enabled}}<option value="{{.Channel}}:{{.ID}}" {{if eq $.Settings.Target (bindingTarget .)}}selected{{end}}>{{tr .Channel}} · {{.Destination}}</option>{{end}}{{end}}</select></div>
<div class="settings-save"><button class="secondary">{{tr "Save notification channel"}}</button></div></form></section>
{{end}}
