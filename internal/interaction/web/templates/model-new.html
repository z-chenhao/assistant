{{define "model-new"}}
<div class="model-connect">
 <a class="back-link" href="/settings/models">{{tr "Models"}}</a>
 {{if eq .Settings.ConnectionMethod "account"}}
 <h1>{{tr "Sign in with an account"}}</h1>
 <div class="setting-row"><span class="setting-name">ChatGPT</span><form action="/auth/login" method="post" data-open-signin><input type="hidden" name="provider" value="chatgpt"><input type="hidden" name="return_to" value="/settings/models"><button class="secondary setting-action">{{tr "Sign in with ChatGPT"}}</button></form></div>
 {{else}}
 <h1>{{tr "Connect with an API key"}}</h1>
 <form class="model-connect-form" action="/model/add" method="post" data-api-connection>
 <label>{{tr "Provider"}}<select name="service" id="api-service"><option value="openai" {{if eq .Settings.Service "openai"}}selected{{end}}>OpenAI</option><option value="custom" {{if eq .Settings.Service "custom"}}selected{{end}}>{{tr "Custom endpoint"}}</option></select></label>
 <label><span class="control-field-label">{{tr "API key"}}{{template "help" (help "api-key-help" (tr "API key") (tr "Local endpoints may not require an API key."))}}</span><input type="password" aria-label="{{tr "API key"}}" name="api_key" maxlength="16384" autocomplete="new-password" spellcheck="false" autocapitalize="off"></label>
 <label>{{tr "Model ID"}}<input name="model" value="{{.Settings.Model}}" required autocomplete="off"></label>
 <details class="model-connection-advanced" {{if eq .Settings.Service "custom"}}open{{end}}><summary>{{tr "Advanced"}}</summary>
 <label>{{tr "Endpoint URL"}}<input type="url" name="endpoint" value="{{.Settings.Endpoint}}" required></label>
 <label>{{tr "Protocol"}}<select name="wire_api"><option value="openai_completions" {{if eq .Settings.WireAPI "openai_completions"}}selected{{end}}>Chat Completions</option><option value="openai_responses" {{if eq .Settings.WireAPI "openai_responses"}}selected{{end}}>Responses</option></select></label>
 <label><span>{{tr "Display name"}} <span class="muted">{{tr "optional"}}</span></span><input name="name" value="{{.Settings.Name}}" placeholder="{{tr "My local model"}}"></label>
 </details>
 <button class="secondary setting-action">{{tr "Connect"}}</button>
 </form>
 {{end}}
</div>
{{end}}
