name: ERII-141 Agent CPU profile

on:
  push:
    branches: [ERII-141-agent-profile]

permissions:
  contents: read

concurrency:
  group: erii-141-agent-profile
  cancel-in-progress: true

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            provider-bridge/package-lock.json
            runtime/javascript/package-lock.json
      - name: Launch and Doctor
        run: |
          mkdir -p evidence
          npm ci --prefix provider-bridge --ignore-scripts
          npm ci --prefix runtime/javascript --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          make build
          python3 scripts/ci_sdk.py prepare --host-cache --evidence evidence/sdk.json
      - name: Same-VM complete Core rounds before and after trace fast path
        env:
          ERII_VERIFY_CASE_JOBS: "4"
        run: |
          git show 174860b376cc29e71d7b3be0cd554a3b1789d2da:scripts/profile_harness.py > evidence/baseline-profile.py
          ERII_PROFILE_DIR="$GITHUB_WORKSPACE/evidence/before-profile" python3 scripts/ci_step.py --name core-before --phase test -- python3 evidence/baseline-profile.py scripts/run_core_cases.py --binary bin/personal-agent --evidence evidence/core-before.json
          ERII_PROFILE_DIR="$GITHUB_WORKSPACE/evidence/after-profile" python3 scripts/ci_step.py --name core-after --phase test -- python3 scripts/profile_harness.py scripts/run_core_cases.py --binary bin/personal-agent --evidence evidence/core-after.json
      - name: Entire Agent SQLite race inventory with original deadline
        run: python3 scripts/ci_step.py --name sqlite-race --phase test -- go test -race -count=1 -timeout=15m ./internal/agent/sqlite
      - name: SDK Doctor and Cleanup
        if: always()
        run: |
          python3 scripts/ci_sdk.py doctor
          python3 scripts/ci_sdk.py cleanup
      - name: Retain exact source, profiles, failures and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-profile-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
