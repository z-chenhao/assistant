name: ERII-141 provider scheduling profile

on:
  push:
    branches: [ERII-141-security-profile]

permissions:
  contents: read

concurrency:
  group: erii-141-security-profile
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  ERII_VERIFY_CASE_JOBS: "4"

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            provider-bridge/package-lock.json
            runtime/javascript/package-lock.json
      - name: Launch and Doctor
        run: |
          mkdir -p evidence
          npm ci --prefix provider-bridge --ignore-scripts
          npm ci --prefix runtime/javascript --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          make build
          python3 scripts/ci_sdk.py prepare --host-cache --evidence evidence/sdk.json
      - name: Compile the exact model-check inventory before either measurement
        run: python3 scripts/ci_step.py --name models-compile-warmup --phase build -- go test -run '^$' ./internal/llm/... ./internal/agent/sqlite
      - name: Complete provider gate before and after on this VM
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          git show 2e04adb886a1293b7f1b31740e09fc22c143b9a7:scripts/verify_suite.py > evidence/baseline-verify-suite.py
          python3 scripts/ci_step.py --name providers-before --phase test -- python3 evidence/baseline-verify-suite.py --binary bin/personal-agent --evidence evidence/providers-before --shard providers --jobs 1 --gate-jobs 2
          python3 scripts/ci_step.py --name providers-after --phase test -- python3 scripts/verify_suite.py --binary bin/personal-agent --evidence evidence/providers-after --shard providers --jobs 1 --gate-jobs 2
      - name: SDK Doctor and Cleanup
        if: always()
        run: |
          python3 scripts/ci_sdk.py doctor
          python3 scripts/ci_sdk.py cleanup
      - name: Retain source, full inventories, failures, timings and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-profile-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
