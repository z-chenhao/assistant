name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Preserve the existing required status name.
    name: Ubuntu checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select documentation-only checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > /tmp/changed-paths
            python3 - <<'PY'
          import os
          from pathlib import Path
          paths = Path('/tmp/changed-paths').read_bytes().decode().split('\0')[:-1]
          docs = bool(paths) and all(p.endswith('.md') and (p.startswith('docs/') or '/' not in p) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('docs_only=' + str(docs).lower() + '\n')
          PY
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Documentation links
        if: steps.scope.outputs.docs_only == 'true'
        run: python3 scripts/check_docs.py
      - uses: ./.github/actions/ci-inputs
        if: steps.scope.outputs.docs_only != 'true'
        with:
          frontend: 'true'
          browser: 'true'
      - name: Agent prompt assembly and frozen Worker inheritance
        if: steps.scope.outputs.docs_only != 'true'
        run: exec python3 tests/system/process_step.py --name prompts --phase test -- make test-prompts
      - name: Code, component and test-infrastructure regressions
        if: steps.scope.outputs.docs_only != 'true'
        run: exec python3 tests/system/process_step.py --name code --phase test -- make test lint
      - name: Core deterministic end-to-end flows
        if: steps.scope.outputs.docs_only != 'true'
        run: exec python3 tests/system/process_step.py --name e2e --phase test -- make test-e2e
      - name: Web Access sources, extraction and durable execution
        if: steps.scope.outputs.docs_only != 'true'
        run: exec python3 tests/system/process_step.py --name web-access --phase test -- make test-web-access
      - name: Task coding isolation and recovery
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 tests/system/process_step.py --name task-code-environments --phase test -- python3 tests/system/verify_capabilities.py --binary bin/steward --scenario task-code-environments --evidence evidence/task-code-environments.json
          exec python3 tests/system/process_step.py --name task-code-recovery --phase test -- python3 tests/system/verify_capabilities.py --binary bin/steward --scenario task-code-recovery --evidence evidence/task-code-recovery.json
      - name: Code Mode discovery, approval and Main responsiveness
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 tests/system/process_step.py --name codemode-catalog --phase test -- python3 tests/system/verify_capabilities.py --binary bin/steward --scenario tool-loading --evidence evidence/codemode-catalog.json
          exec python3 tests/system/process_step.py --name codemode-main --phase test -- python3 tests/system/verify_capabilities.py --binary bin/steward --scenario main-business --evidence evidence/codemode-main.json
      - name: Native Linux account credentials
        if: steps.scope.outputs.docs_only != 'true'
        run: exec python3 tests/system/process_step.py --name native-account --phase test -- python3 tests/system/entrypoint.py tests/system/verify_account.py --binary bin/steward --native-secret-service --evidence evidence/native-account.json
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
