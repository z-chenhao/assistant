name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Preserve the existing required status name.
    name: Ubuntu checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select documentation-only checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-paths
            python3 - <<'PY'
          import os
          from pathlib import Path
          paths = Path('/tmp/changed-paths').read_text().splitlines()
          docs = bool(paths) and all((p.startswith('docs/') and p.endswith('.md')) or p in ('README.md', 'CONTRIBUTING.md', 'SECURITY.md') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('docs_only=' + str(docs).lower() + '\n')
          PY
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Documentation links
        if: steps.scope.outputs.docs_only == 'true'
        run: python3 scripts/check_docs.py
      - uses: ./.github/actions/ci-inputs
        if: steps.scope.outputs.docs_only != 'true'
        with:
          frontend: 'true'
          browser: 'true'
      - name: Code, component and test-infrastructure regressions
        if: steps.scope.outputs.docs_only != 'true'
        run: exec python3 tests/system/process_step.py --name code --phase test -- make test lint
      - name: Core deterministic end-to-end flows
        if: steps.scope.outputs.docs_only != 'true'
        run: exec python3 tests/system/process_step.py --name e2e --phase test -- make test-e2e
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
