name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Check scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      software: ${{ steps.partitions.outputs.software }}
      system: ${{ steps.partitions.outputs.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select documentation-only checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > /tmp/changed-paths
            python3 - <<'PY'
          import os
          from pathlib import Path
          paths = Path('/tmp/changed-paths').read_bytes().decode().split('\0')[:-1]
          docs = bool(paths) and all(p.endswith('.md') and (p.startswith('docs/') or '/' not in p) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('docs_only=' + str(docs).lower() + '\n')
          PY
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check partitions
        id: partitions
        run: |
          echo "software=$(python3 tests/system/ci.py --plan software)" >> "$GITHUB_OUTPUT"
          echo "system=$(python3 tests/system/ci.py --plan system)" >> "$GITHUB_OUTPUT"
      - name: Documentation links
        if: steps.scope.outputs.docs_only == 'true'
        run: python3 scripts/check_docs.py
  software:
    name: Software / ${{ matrix.lane }}
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.software) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-inputs
        with:
          frontend: ${{ matrix.frontend }}
          browser: ${{ matrix.browser }}
      - name: Run existing software checks
        env:
          CI_LANE: ${{ matrix.lane }}
        run: exec python3 tests/system/ci.py --lane "$CI_LANE"
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
  system:
    name: System / ${{ matrix.lane }}
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.system) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-inputs
        with:
          frontend: ${{ matrix.frontend }}
          browser: ${{ matrix.browser }}
      - name: Run existing deterministic system checks
        env:
          CI_LANE: ${{ matrix.lane }}
        run: exec python3 tests/system/ci.py --lane "$CI_LANE"
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
  checks:
    # Branch protection continues to require this exact status.
    name: Ubuntu checks
    needs: [scope, software, system]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected lane
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tests/system/ci.py --results "$CI_NEEDS"
