name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fast:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-inputs
      - name: Unit tests and lint
        run: exec python3 scripts/ci_step.py --name unit-lint --phase test -- make test lint
      - name: Public SDK isolation and cache-miss conformance
        env:
          ERII_CI_PUBLIC_SDK_PROBE: "1"
        run: exec python3 scripts/ci_step.py --name sdk-conformance --phase test -- go test ./internal/computer/workspace -run '^TestCIInstalledSDKConformance$' -count=1
      - name: Verify the copied SDK stayed immutable
        if: ${{ always() }}
        run: python3 scripts/ci_sdk.py doctor
      - name: Retain exact-SHA evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-fast-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-inputs
      - name: Race detector
        # Isolate the one-second Bridge burst/control fixture; preserve normal
        # package parallelism for the complete remainder, with an audited inventory.
        run: exec python3 scripts/ci_step.py --name race --phase test -- python3 scripts/ci_race.py
      - name: Verify the copied SDK stayed immutable
        if: ${{ always() }}
        run: python3 scripts/ci_sdk.py doctor
      - name: Retain exact-SHA evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-race-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verification (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    env:
      ERII_VERIFY_CASE_JOBS: "4"
      ERII_VERIFY_GATE_JOBS: "2"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["runtime", "security", "delivery", "providers"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-inputs
        with:
          sandbox: ${{ matrix.shard == 'providers' || matrix.shard == 'security' }}
      - name: CLI verification with timings
        run: exec python3 scripts/ci_step.py --name verification --phase test -- python3 scripts/verify_suite.py --binary bin/personal-agent --evidence evidence --shard ${{ matrix.shard }} --jobs 1
      - name: Verify the copied SDK stayed immutable
        if: ${{ always() }}
        run: python3 scripts/ci_sdk.py doctor
      - name: Retain exact-SHA evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  codemode:
    name: Code Mode (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ERII_VERIFY_CASE_JOBS: "4"
      ERII_VERIFY_GATE_JOBS: "2"
    strategy:
      fail-fast: false
      matrix:
        part: ["control", "GC-17", "GC-19", "GC-20", "contracts"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-inputs
      - name: Code Mode part with five consecutive repetitions
        run: exec python3 scripts/ci_step.py --name verification --phase test -- python3 scripts/verify_suite.py --binary bin/personal-agent --evidence evidence --shard codemode --codemode-part ${{ matrix.part }} --jobs 1
      - name: Verify the copied SDK stayed immutable
        if: ${{ always() }}
        run: python3 scripts/ci_sdk.py doctor
      - name: Retain exact-SHA evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-codemode-${{ matrix.part }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  codemode_join:
    name: Complete Code Mode evidence
    needs: codemode
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-codemode-*-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/parts
      - name: Require successful parts and reconstruct full logical inventory
        env:
          PART_RESULT: ${{ needs.codemode.result }}
        run: |
          test "$PART_RESULT" = success
          for part in control GC-17 GC-19 GC-20 contracts; do
            mv "evidence/parts/evidence-codemode-$part-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "evidence/parts/$part"
          done
          python3 scripts/ci_codemode.py --parts evidence/parts --evidence evidence
      - name: Retain full Code Mode evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-codemode-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  checks:
    name: Ubuntu checks
    needs: ["fast", "race", "verify", "codemode", "codemode_join"]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require every shard to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py
