name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Ubuntu checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: provider-bridge/package-lock.json
      - name: Install pinned Bridge dependencies
        run: npm ci --prefix provider-bridge --ignore-scripts
      - name: Unit tests
        run: make test
      - name: Race detector
        run: make test-race
      - name: Lint
        run: make lint
      - name: CLI verification
        run: make verify
