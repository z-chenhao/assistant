name: Extended regression
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'
permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: macOS native contracts
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: CLI, startup, credential adapter and offline VM contracts
        run: go test -count=1 ./cmd/steward ./internal/startup ./internal/llm/secret ./internal/computer/macosvm/...
  regression:
    name: Full deterministic regression and race checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-inputs
        with:
          frontend: 'true'
          browser: 'true'
      - name: Extended product flows
        run: exec python3 tests/system/process_step.py --name full --phase test -- make test-full
      - name: Race detector
        if: ${{ !cancelled() }}
        run: exec python3 tests/system/process_step.py --name race --phase test -- make test-race
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
