name: Development runtime
description: Pinned tools and lockfile-installed dependencies shared by software checks
inputs:
  frontend:
    description: Install frontend build and TypeScript dependencies
    default: 'false'
  browser:
    description: Install the pinned browser and system libraries
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: |
          provider-bridge/package-lock.json
          runtime/javascript/package-lock.json
          guest-browser/package-lock.json
          web/package-lock.json
    - name: Install locked packages
      shell: bash
      env:
        NPM_CONFIG_AUDIT: 'true'
      run: |
        packages=(provider-bridge runtime/javascript)
        if [ '${{ inputs.browser }}' = true ]; then packages+=(guest-browser); fi
        if [ '${{ inputs.frontend }}' = true ]; then packages+=(web); fi
        python3 scripts/setup.py --part packages --packages "${packages[@]}" --timeout 600
    - name: Prepare the coding sandbox
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install the locked browser
      if: inputs.browser == 'true'
      shell: bash
      run: python3 scripts/setup.py --part browser --with-deps --timeout 600 --evidence evidence/setup-browser.json
