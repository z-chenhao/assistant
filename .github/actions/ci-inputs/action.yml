name: Offline CI runtime
description: Prepare pinned dependencies, isolated public SDK and exact-source binary
inputs:
  frontend:
    description: Install frontend build and TypeScript dependencies (unit/lint only)
    default: "false"
  browser:
    description: Install Playwright for Browser contract and UI journeys
    default: "false"
  sandbox:
    description: Install the offline coding sandbox
    default: "true"
  temporary-fixtures:
    description: Use bounded tmpfs for disposable fixtures
    default: "false"
runs:
  using: composite
  steps:
    - name: Use the Ubuntu archive for dependency downloads
      shell: bash
      # Azure's mirror repeatedly served browser prerequisites at ~55 kB/s,
      # consuming 8–9 minutes of the unchanged ten-minute job limit.
      run: sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: |
          provider-bridge/package-lock.json
          runtime/javascript/package-lock.json
          guest-browser/package-lock.json
          web/package-lock.json
    - name: Install pinned dependencies
      shell: bash
      run: |
        npm ci --prefix provider-bridge --ignore-scripts
        npm ci --prefix runtime/javascript --ignore-scripts
    - name: Install pinned Browser dependencies
      if: inputs.browser == 'true'
      shell: bash
      run: npm ci --prefix guest-browser --ignore-scripts
    - name: Install pinned frontend build dependencies
      if: inputs.frontend == 'true'
      shell: bash
      run: npm ci --prefix web --ignore-scripts
    - name: Provision copied public SDK
      shell: bash
      run: exec python3 scripts/ci_step.py --name sdk --phase setup -- python3 scripts/ci_sdk.py prepare --evidence evidence/sdk.json
    - name: Build this job's exact-source CLI
      shell: bash
      run: exec env GOROOT="$ERII_CI_BASE_GOROOT" PATH="$ERII_CI_BASE_GOROOT/bin:$PATH" python3 scripts/ci_step.py --name build --phase build -- make build
    - name: Prepare isolated coding fixture runtime
      if: inputs.sandbox == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Verify fixture storage
      shell: bash
      run: python3 scripts/ci_tmpfs.py ${{ inputs.temporary-fixtures == 'true' && 'setup' || 'disk' }}
