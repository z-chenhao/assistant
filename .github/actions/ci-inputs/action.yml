name: Development runtime
description: Pinned tools and lockfile-installed dependencies shared by software checks
inputs:
  frontend:
    description: Install frontend build and TypeScript dependencies
    default: 'false'
  browser:
    description: Install the pinned browser and system libraries
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: |
          provider-bridge/package-lock.json
          runtime/javascript/package-lock.json
          guest-browser/package-lock.json
          web/package-lock.json
    - name: Install locked packages
      shell: bash
      env:
        NPM_CONFIG_AUDIT: 'true'
      run: |
        packages=(provider-bridge runtime/javascript)
        if [ '${{ inputs.browser }}' = true ]; then packages+=(guest-browser); fi
        if [ '${{ inputs.frontend }}' = true ]; then packages+=(web); fi
        python3 scripts/setup.py --part packages --packages "${packages[@]}" --timeout 120
    - name: Prepare local execution and OCR dependencies
      shell: bash
      run: |
        # The hosted image's Azure mirror can throttle font downloads for
        # minutes. Use Ubuntu's HTTPS archive for this disposable runner.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
        fi
        sudo timeout --kill-after=10s 90s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
        sudo timeout --kill-after=10s 90s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y bubblewrap tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install the locked browser
      if: inputs.browser == 'true'
      shell: bash
      run: python3 scripts/setup.py --part browser --with-deps --timeout 120 --evidence evidence/setup-browser.json
