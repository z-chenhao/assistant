version: 1
# Optional durable recall. Install/serve the selected model explicitly.
# No implicit embedding provider or FTS-only fallback. See docs/features/memory-context.md.
# embedding:
#   provider: openai_compatible
#   endpoint: http://127.0.0.1:11434/v1
#   model: nomic-embed-text
#   dimensions: 768
#   api_key_ref: credential-reference-in-SecretStore
# Optional external MCP and curated Skill content. Core file/command and Skill discovery tools are built in.
# mcp:
#   - name: local_catalog
#     command: /absolute/path/to/self-contained-mcp-server
#     args: []
#     directory: /absolute/path/to/provider-state
#     tools: {lookup: read_only, send: external_effect}
# skills:
#   root: /absolute/path/to/curated-skills
#   scope: agent  # agent or workspace, within this local Agent
# Optional override of the default isolated workspace (<app.data_root>.computer).
# Omit when using computer: all four tools then share that Guest.
# execution:
#   root: /absolute/private/execution-workspace
#   toolchain_roots: [/absolute/read-only/compiler-install]

app:
  # Must be absolute. COLLIE_DATA_ROOT can override this for deployment.
  data_root: /tmp/collie-local
  log_level: info
  log_max_bytes: 16777216
  log_backups: 2
# Production TUI/Web/automation work starts NATS before Tool admission.
# Explicit offline CLI scans/diagnostics and deterministic Fakes remain available.
nats:
  url: nats://127.0.0.1:4222
  # Use a dedicated prefix per data root on a shared broker. Never embed credentials.
  stream_prefix: collie
  timeout: 2s
  ack_wait: 30s
  retry_interval: 1s
  # Remote brokers require tls:// and a token reference in SecretStore.
  # token_ref: env:COLLIE_NATS_TOKEN
  max_age: 168h
  max_bytes: 1073741824
  max_messages: 1000000
  max_message_bytes: 1048576
  poison_attempts: 5

# Frozen per new Root tree; existing Runs retain their limits after restart.
# Safety ceilings reject with RESOURCE_LIMIT; concurrency still queues normally.
children:
  max_depth: 8          # deployment hard ceiling 16
  max_descendants: 4096 # deployment hard ceiling 10000
  max_tool_calls: 10000 # deployment hard ceiling 50000

# Fair Host scheduling across Root trees; Main has a separate reserved slot.
# Each capacity is 1..32. These limits never enter the model protocol.
scheduler:
  child_concurrency: 16
  global_concurrency: 32
  user_concurrency: 32
  agent_concurrency: 32
  provider_concurrency: 32
  max_worker_turns: 256 # frozen per Root, hard ceiling 512
  infrastructure_failures: 5 # consecutive unavailability/rate limiting
  cooldown_seconds: 30

# Monetary authorization is opt-in; absent/zero boundary means unconfigured.
# Account is provider_kind:auth_connection_id, or provider_kind:endpoint_hash
# for an unauthenticated local endpoint. `spend status` shows sanitized keys.
# All four rates must be explicit integers (including any intentional zeros).
# Values below are synthetic, NOT current provider prices. Replace all metadata.
# spend:
#   accounts:
#     - account: openai_compatible:REPLACE_WITH_ENDPOINT_HASH
#       currency: USD
#       boundary_micros: 10000000 # 10 currency units, cumulative across Roots
#       prices:
#         - model: REPLACE_WITH_EXACT_MODEL_ID
#           version: operator-price-v1
#           input_micros_per_million: 1000000
#           output_micros_per_million: 2000000
#           cache_read_micros_per_million: 200000
#           cache_write_micros_per_million: 1200000

tasks:
  recent_days: 30
  recent_limit: 200

# Optional real local-model Bridge. Install pinned dependencies first; use an absolute path.
# llm:
#   provider_bridge_command: node
#   provider_bridge_script: /absolute/path/to/collie/provider-bridge/bridge.mjs
#   provider_bridge_version: pi-ai-1.3.0-v1

# Host limits apply across CLI processes sharing this data root. Waiting calls
# release execution capacity. External-effect approvals expire after one hour.
tools:
  global_concurrency: 32
  agent_concurrency: 24
  run_concurrency: 4
  provider_concurrency: 16
  tool_concurrency: 8
  approval_ttl_seconds: 3600

# Immutable binary storage under app.data_root/artifacts. Cleanup protects
# references and active/paused Tasks; artifact cleanup defaults to dry-run.
artifact:
  retention_days: 30
  quota_bytes: 1073741824
  max_bytes: 67108864
  cleanup_batch: 100

# Delivery to the local terminal inbox, independent of model readiness.
delivery:
  lease_seconds: 5
  retry_milliseconds: 250
  max_attempts: 5

# Normal installed startup includes Code Mode. Explicit custom deployments may set:
# npm ci --prefix runtime/javascript --ignore-scripts
# Pin Node 24.21.0; both paths must be absolute and outside an editable workspace.
# javascript:
#   command: /absolute/path/to/node
#   script: /absolute/path/to/collie/runtime/javascript/src/sidecar.mjs

# Optional background Memory maintenance. The reference resolves to an existing
# 32-byte key in SecretStore; never put key bytes in YAML. No per-record prompts.
# When embedding is enabled with maintenance, its endpoint must be literal loopback.
# memory:
#   encryption_key_ref: env:COLLIE_MEMORY_KEY

# Frozen per Run; Children inherit the Parent policy. Provisional defaults.
context:
  threshold_percentage: 0.75
  recent_messages: 6
  summary_bytes: 2048

# Optional managed Guest Chromium (inside the existing computer: block):
#   browser:
#     node: /opt/collie/node/bin/node
#     module: /opt/collie/browser/node_modules/playwright-core/index.mjs
#     port: 9222
# Install pinned guest-browser/package-lock.json and collie-transfer.py in the
# clean Guest. See docs/features/computer-use.md. No Host browser or personal profile.

# Automation intent is persisted through Main/automation manage, not YAML.
# Run collie automation work in the foreground under your supervisor.
# Every intent carries its own IANA timezone; see docs/features/automation.md.

# Optional authenticated Web surface; listener must be literal loopback.
# web:
#   listen: 127.0.0.1:8787
#   token_ref: env:COLLIE_WEB_TOKEN
# Optional Feishu p2p channel. Enroll the exact owner/chat through channel manage.
# All credentials resolve through SecretStore; never put token values here.
# feishu:
#   app_id: your-app-id
#   tenant_key: your-tenant-key
#   verification_token_ref: env:COLLIE_FEISHU_VERIFICATION_TOKEN
#   encrypt_key_ref: env:COLLIE_FEISHU_ENCRYPT_KEY
#   access_token_ref: env:COLLIE_FEISHU_ACCESS_TOKEN
